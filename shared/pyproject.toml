[project]
name = "bpcommon"
version = "0.1.0"
description = "Shared building blocks (logging, errors, metrics) for the backend portfolio"
requires-python = ">=3.12"
dependencies = ["fastapi==0.163.1", "prometheus-client==0.26.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bpcommon"]
