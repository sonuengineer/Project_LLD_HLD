#   docker compose up -d --build     -> http://127.0.0.1:58008/editor (2 servers behind nginx)
name: p08-collab
x-env: &env
  COLLAB_DATABASE_URL: postgresql+asyncpg://collab:${COLLAB_DB_PASSWORD:-collab_dev_password}@postgres:5432/collab
  COLLAB_REDIS_URL: redis://redis:6379/0
x-img: &img
  build: {context: ../.., dockerfile: projects/08-collab/Dockerfile}
services:
  postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_USER: collab, POSTGRES_PASSWORD: "${COLLAB_DB_PASSWORD:-collab_dev_password}", POSTGRES_DB: collab}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U collab"], interval: 3s, retries: 20}
  redis:
    image: redis:7-alpine
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 3s, retries: 20}
  migrate:
    <<: *img
    environment: *env
    command: ["alembic", "upgrade", "head"]
    depends_on: {postgres: {condition: service_healthy}}
  collab1:
    <<: *img
    environment: {<<: *env, COLLAB_SERVER_ID: collab1}
    depends_on: {migrate: {condition: service_completed_successfully}, redis: {condition: service_healthy}}
  collab2:
    <<: *img
    environment: {<<: *env, COLLAB_SERVER_ID: collab2}
    depends_on: {migrate: {condition: service_completed_successfully}, redis: {condition: service_healthy}}
  nginx:
    image: nginx:alpine
    volumes: ["./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["127.0.0.1:58008:80"]
    depends_on: [collab1, collab2]
