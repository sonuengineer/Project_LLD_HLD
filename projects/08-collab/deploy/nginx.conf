# Any collab server can serve any document (sequencing is in Postgres, fan-out via Redis),
# so plain round-robin works -- no sticky sessions needed for WebSockets.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
upstream collab { server collab1:8000; server collab2:8000; }
server {
    listen 80;
    location / {
        proxy_pass http://collab;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;     # idle WebSockets would otherwise be cut after 60s
    }
}
