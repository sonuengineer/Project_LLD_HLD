# minidis master + replica, and real Redis for side-by-side benchmarking.
#   docker compose up -d --build
#   docker compose run --rm cli redis-cli -h master -p 6380 set hello world
#   docker compose run --rm cli redis-cli -h replica -p 6380 get hello
name: p02-mini-redis
services:
  master:
    build: {context: ../.., dockerfile: projects/02-mini-redis/Dockerfile}
    volumes: ["master-data:/data"]
    ports: ["127.0.0.1:56380:6380"]
  replica:
    build: {context: ../.., dockerfile: projects/02-mini-redis/Dockerfile}
    command: ["python", "-m", "minidis", "--host", "0.0.0.0", "--port", "6380", "--dir", "/data",
              "--appendonly", "yes", "--replicaof", "master:6380"]
    volumes: ["replica-data:/data"]
    ports: ["127.0.0.1:56381:6380"]
    depends_on: [master]
  real-redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    profiles: ["bench"]
  cli:
    image: redis:7-alpine
    profiles: ["tools"]
    entrypoint: []
volumes:
  master-data:
  replica-data:
