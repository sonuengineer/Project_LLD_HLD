#   docker compose up -d --build      -> API http://127.0.0.1:58009/docs, dashboard /dashboard
#   python demo.py http://127.0.0.1:58009
# MOCK PROVIDER ONLY. Never configure real payment credentials here.
name: p09-payments
x-env: &env
  PAY_DATABASE_URL: postgresql+asyncpg://pay:${PAY_DB_PASSWORD:-pay_dev_password}@postgres:5432/payments
  PAY_PROVIDER_URL: http://provider:8000
  PAY_PROVIDER_API_KEY: mock_provider_key
  PAY_PROVIDER_WEBHOOK_SECRET: whsec_mock_provider
  PAY_ADMIN_TOKEN: ${PAY_ADMIN_TOKEN:-change-me-pay-admin}
x-img: &img
  build: {context: ../.., dockerfile: projects/09-payments/Dockerfile}
services:
  postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_USER: pay, POSTGRES_PASSWORD: "${PAY_DB_PASSWORD:-pay_dev_password}", POSTGRES_DB: payments}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U pay"], interval: 3s, retries: 20}
  migrate:
    <<: *img
    environment: *env
    command: ["alembic", "upgrade", "head"]
    depends_on: {postgres: {condition: service_healthy}}
  provider:
    <<: *img
    command: ["uvicorn", "mockprovider.app:app_from_env", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      PROVIDER_DATABASE_URL: postgresql+asyncpg://pay:${PAY_DB_PASSWORD:-pay_dev_password}@postgres:5432/payments
      PROVIDER_API_KEY: mock_provider_key
      PROVIDER_WEBHOOK_URL: http://api:8000/webhooks/provider
      PROVIDER_WEBHOOK_SECRET: whsec_mock_provider
    depends_on: {migrate: {condition: service_completed_successfully}}
  api:
    <<: *img
    environment: *env
    ports: ["127.0.0.1:58009:8000"]
    depends_on: {migrate: {condition: service_completed_successfully}, provider: {condition: service_started}}
  worker:
    <<: *img
    environment: *env
    command: ["python", "-m", "payments.worker"]
    depends_on: {migrate: {condition: service_completed_successfully}}
volumes:
  pgdata:
