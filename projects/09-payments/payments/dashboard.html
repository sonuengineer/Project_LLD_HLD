<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payments Dashboard</title>
<style>
:root{--bg:#0f1115;--fg:#e6e6e6;--mut:#9aa4b2;--line:#2a2f3a;--ok:#7ee787;--bad:#ff7b72;--warn:#e3b341;--card:#161a22}
body{font-family:system-ui,sans-serif;margin:0;padding:20px;background:var(--bg);color:var(--fg)}
h1{font-size:20px;margin:0 0 12px}h2{font-size:15px;color:var(--mut);margin:20px 0 8px}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mut)}.captured,.refunded,.partially_refunded,.ok{color:var(--ok)}.declined,.failed,.bad{color:var(--bad)}
.requires_reconciliation,.authorizing,.capturing,.voiding{color:var(--warn)}
input{background:var(--card);color:var(--fg);border:1px solid var(--line);padding:6px 8px;border-radius:4px}.wrap{overflow-x:auto}code{color:var(--mut)}
</style></head><body>
<h1>Payments (mock provider -- test money only)</h1>
<p>Merchant key: <input id="k" type="password" size="40" placeholder="sk_test_..."> <span id="err" class="bad"></span></p>
<h2>Ledger balances (derived from double-entry entries)</h2><div class="wrap"><table><thead><tr><th>Account</th><th>Currency</th><th>Balance (minor units)</th></tr></thead><tbody id="bal"></tbody></table></div>
<h2>Recent payments</h2><div class="wrap"><table><thead><tr><th>Payment</th><th>Reference</th><th>Amount</th><th>Status</th><th>Captured</th><th>Refunded</th><th>Fee</th><th>Updated</th></tr></thead><tbody id="pay"></tbody></table></div>
<script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
try{$('k').value=localStorage.getItem('pay_k')||''}catch(e){}
$('k').onchange=()=>{try{localStorage.setItem('pay_k',$('k').value)}catch(e){}};
async function api(p){const r=await fetch(p,{headers:{Authorization:'Bearer '+$('k').value}});if(!r.ok)throw new Error(p+' -> '+r.status);return r.json()}
async function tick(){if(!$('k').value)return;try{
 const b=await api('/ledger/balances');$('err').textContent='';
 $('bal').innerHTML=b.balances.map(x=>`<tr><td>${esc(x.account)}</td><td>${esc(x.currency)}</td><td>${x.balance}</td></tr>`).join('')||'<tr><td colspan=3>no entries</td></tr>';
 const p=await api('/payments?limit=50');
 $('pay').innerHTML=p.payments.map(x=>`<tr><td><code>${esc(x.id).slice(0,8)}</code></td><td>${esc(x.merchant_reference)}</td><td>${x.amount} ${esc(x.currency)}</td><td class="${esc(x.status)}">${esc(x.status)}</td><td>${x.amount_captured}</td><td>${x.amount_refunded}</td><td>${x.fee}</td><td>${esc(x.updated_at).slice(0,19)}</td></tr>`).join('');
}catch(e){$('err').textContent=e.message}}
setInterval(tick,2000);tick();
</script></body></html>
