#   docker compose up -d --build     -> API http://127.0.0.1:58007/docs, blobs in SeaweedFS (S3 API)
#   python seed.py http://127.0.0.1:58007
name: p07-object-storage
x-env: &env
  OBJ_DATABASE_URL: postgresql+asyncpg://obj:${OBJ_DB_PASSWORD:-obj_dev_password}@postgres:5432/objstore
  OBJ_STORAGE_BACKEND: s3
  OBJ_S3_ENDPOINT: http://seaweedfs:8333
  OBJ_S3_BUCKET: objstore-blobs
  OBJ_ADMIN_TOKEN: ${OBJ_ADMIN_TOKEN:-change-me-obj-admin}
  OBJ_PUBLIC_BASE_URL: http://127.0.0.1:58007
x-img: &img
  build: {context: ../.., dockerfile: projects/07-object-storage/Dockerfile}
services:
  postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_USER: obj, POSTGRES_PASSWORD: "${OBJ_DB_PASSWORD:-obj_dev_password}", POSTGRES_DB: objstore}
    volumes: ["metadata:/var/lib/postgresql/data"]   # without this, recreating the container loses all metadata
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U obj"], interval: 3s, retries: 20}
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-s3", "-dir=/data"]
    volumes: ["blobs:/data"]
  migrate:
    <<: *img
    environment: *env
    command: ["alembic", "upgrade", "head"]
    depends_on: {postgres: {condition: service_healthy}}
  api:
    <<: *img
    environment: *env
    ports: ["127.0.0.1:58007:8000"]
    depends_on: {migrate: {condition: service_completed_successfully}, seaweedfs: {condition: service_started}}
  worker:
    <<: *img
    environment: *env
    command: ["python", "-m", "objstore.worker"]
    depends_on: {migrate: {condition: service_completed_successfully}, seaweedfs: {condition: service_started}}
volumes:
  blobs:
  metadata:
