#   docker compose up -d --build
#   python seed.py http://127.0.0.1:58004 http://127.0.0.1:58014
name: p04-webhooks
x-env: &env
  WH_DATABASE_URL: postgresql+asyncpg://wh:${WH_DB_PASSWORD:-wh_dev_password}@postgres:5432/webhooks
  WH_REDIS_URL: redis://redis:6379/0
  WH_API_TOKEN: ${WH_API_TOKEN:-change-me-wh-token}
  # Demo only: the receiver lives on the private Docker network. NEVER true in production (SSRF).
  WH_ALLOW_PRIVATE_DESTINATIONS: "true"
x-img: &img
  build: {context: ../.., dockerfile: projects/04-webhooks/Dockerfile}
services:
  postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_USER: wh, POSTGRES_PASSWORD: "${WH_DB_PASSWORD:-wh_dev_password}", POSTGRES_DB: webhooks}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U wh"], interval: 3s, retries: 20}
  redis:
    image: redis:7-alpine
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 3s, retries: 20}
  migrate:
    <<: *img
    environment: *env
    command: ["alembic", "upgrade", "head"]
    depends_on: {postgres: {condition: service_healthy}}
  api:
    <<: *img
    environment: *env
    ports: ["127.0.0.1:58004:8000"]
    depends_on: {migrate: {condition: service_completed_successfully}}
  dispatcher:
    <<: *img
    environment: *env
    command: ["python", "-m", "webhooks.dispatcher"]
    deploy: {replicas: 2}
    depends_on: {migrate: {condition: service_completed_successfully}, redis: {condition: service_healthy}}
  receiver:
    <<: *img
    command: ["uvicorn", "webhooks.receiver.app:app", "--host", "0.0.0.0", "--port", "9000", "--no-access-log"]
    ports: ["127.0.0.1:58014:9000"]
