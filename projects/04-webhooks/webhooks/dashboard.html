<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Webhook Deliveries</title>
<style>
:root{--bg:#0f1115;--fg:#e6e6e6;--mut:#9aa4b2;--line:#2a2f3a;--ok:#7ee787;--bad:#ff7b72;--warn:#e3b341;--card:#161a22}
body{font-family:system-ui,sans-serif;margin:0;padding:20px;background:var(--bg);color:var(--fg)}
h1{font-size:20px;margin:0 0 12px}h2{font-size:15px;color:var(--mut);margin:20px 0 8px}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut)}.succeeded,.ok{color:var(--ok)}.dead,.bad{color:var(--bad)}.pending,.in_flight{color:var(--warn)}
input,select,button{background:var(--card);color:var(--fg);border:1px solid var(--line);padding:6px 8px;border-radius:4px}
code{font-size:12px;color:var(--mut)}.wrap{overflow-x:auto}#cards{display:flex;gap:12px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 14px;min-width:110px}.card b{font-size:20px;display:block}
</style></head><body>
<h1>Webhook deliveries</h1>
<p>API token: <input id="tok" type="password" size="28"> <select id="flt"><option value="">all</option><option>pending</option><option>in_flight</option><option>succeeded</option><option>dead</option></select> <span id="err" class="bad"></span></p>
<div id="cards"></div>
<h2>Endpoints</h2><div class="wrap"><table><thead><tr><th>Endpoint</th><th>URL</th><th>Status</th><th>Consecutive failures</th><th>Rate/s</th></tr></thead><tbody id="eps"></tbody></table></div>
<h2>Recent deliveries</h2><div class="wrap"><table><thead><tr><th>#</th><th>Event</th><th>Endpoint</th><th>Status</th><th>Attempts</th><th>Last code</th><th>Last error</th><th></th></tr></thead><tbody id="dl"></tbody></table></div>
<script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
try{$('tok').value=localStorage.getItem('wh_tok')||''}catch(e){}
$('tok').onchange=()=>{try{localStorage.setItem('wh_tok',$('tok').value)}catch(e){}};
async function api(p,o={}){const r=await fetch(p,{...o,headers:{Authorization:'Bearer '+$('tok').value}});if(!r.ok)throw new Error(p+' -> '+r.status);return r.json()}
async function retry(id){await api('/deliveries/'+id+'/retry',{method:'POST'});tick()}
async function tick(){if(!$('tok').value)return;try{
 const st=await api('/stats');$('err').textContent='';
 $('cards').innerHTML=['pending','in_flight','succeeded','dead'].map(k=>`<div class=card><span class=${k}>${k}</span><b>${st.deliveries[k]||0}</b></div>`).join('');
 const e=await api('/endpoints');$('eps').innerHTML=e.endpoints.map(x=>`<tr><td><code>${x.id}</code></td><td>${esc(x.url)}</td><td class="${x.enabled?'ok':'bad'}">${x.enabled?'enabled':'disabled: '+esc(x.disabled_reason)}</td><td>${x.consecutive_failures}</td><td>${x.rate_limit_per_second}</td></tr>`).join('');
 const f=$('flt').value;const d=await api('/deliveries?limit=50'+(f?'&status='+f:''));
 $('dl').innerHTML=d.deliveries.map(x=>`<tr><td>${x.id}</td><td><code>${x.event_id}</code></td><td><code>${x.endpoint_id}</code></td><td class=${x.status}>${x.status}</td><td>${x.attempts}</td><td>${x.last_status_code??''}</td><td><code>${esc(x.last_error)}</code></td><td>${x.status==='dead'?`<button onclick="retry(${x.id})">Replay</button>`:''}</td></tr>`).join('');
}catch(err){$('err').textContent=err.message}}
setInterval(tick,2000);tick();
</script></body></html>
