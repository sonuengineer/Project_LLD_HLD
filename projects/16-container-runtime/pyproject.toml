[project]
name = "p16-container-runtime"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []     # stdlib only, on purpose

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: needs Linux + root + a rootfs (MINIBOX_TEST_ROOTFS); skipped elsewhere",
    "network: needs internet access (pulls from Docker Hub)",
]
