#   docker compose up -d --build      -> http://127.0.0.1:58006/docs
#   python seed.py http://127.0.0.1:58006
name: p06-saas
x-env: &env
  # App runs as saas_app (no superuser, no table ownership) so row-level security applies.
  SAAS_DATABASE_URL: postgresql+asyncpg://saas_app:${SAAS_APP_DB_PASSWORD:-saas_app_dev}@postgres:5432/saas
  SAAS_MIGRATION_DATABASE_URL: postgresql+asyncpg://owner:${SAAS_OWNER_PASSWORD:-owner_dev}@postgres:5432/saas
  SAAS_APP_DB_PASSWORD: ${SAAS_APP_DB_PASSWORD:-saas_app_dev}
  SAAS_REDIS_URL: redis://redis:6379/0
  SAAS_JWT_SECRET: ${SAAS_JWT_SECRET:-change-me-jwt-secret-at-least-32-bytes-long!!}
x-img: &img
  build: {context: ../.., dockerfile: projects/06-saas/Dockerfile}
services:
  postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_USER: owner, POSTGRES_PASSWORD: "${SAAS_OWNER_PASSWORD:-owner_dev}", POSTGRES_DB: saas}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U owner"], interval: 3s, retries: 20}
  redis:
    image: redis:7-alpine
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 3s, retries: 20}
  migrate:
    <<: *img
    environment: *env
    command: ["alembic", "upgrade", "head"]
    depends_on: {postgres: {condition: service_healthy}}
  api:
    <<: *img
    environment: *env
    ports: ["127.0.0.1:58006:8000"]
    depends_on: {migrate: {condition: service_completed_successfully}, redis: {condition: service_healthy}}
  worker:
    <<: *img
    environment: *env
    command: ["python", "-m", "saas.worker"]
    depends_on: {migrate: {condition: service_completed_successfully}, redis: {condition: service_healthy}}
