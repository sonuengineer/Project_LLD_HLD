# Horizontal scaling demo: 3 API replicas + nginx + one shared Redis.
#   docker compose up --build
#   curl -i http://localhost:58001/api/resource
name: p01-rate-limiter
x-api: &api
  build: {context: ../.., dockerfile: projects/01-rate-limiter/Dockerfile}
  depends_on: {redis: {condition: service_healthy}}
services:
  redis:
    image: redis:7-alpine
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 3s, retries: 20}
  api1: {<<: *api, environment: {RL_REDIS_URL: "redis://redis:6379/0", RL_ADMIN_TOKEN: "${RL_ADMIN_TOKEN:-change-me-admin-token}", RL_TRUST_FORWARDED_FOR: "true", RL_INSTANCE_NAME: api1}}
  api2: {<<: *api, environment: {RL_REDIS_URL: "redis://redis:6379/0", RL_ADMIN_TOKEN: "${RL_ADMIN_TOKEN:-change-me-admin-token}", RL_TRUST_FORWARDED_FOR: "true", RL_INSTANCE_NAME: api2}}
  api3: {<<: *api, environment: {RL_REDIS_URL: "redis://redis:6379/0", RL_ADMIN_TOKEN: "${RL_ADMIN_TOKEN:-change-me-admin-token}", RL_TRUST_FORWARDED_FOR: "true", RL_INSTANCE_NAME: api3}}
  nginx:
    image: nginx:alpine
    volumes: ["./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["127.0.0.1:58001:80"]
    depends_on: [api1, api2, api3]
