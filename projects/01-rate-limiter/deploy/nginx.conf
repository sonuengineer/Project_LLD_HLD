# Round-robin load balancer in front of 3 rate limiter instances. All instances share one
# Redis, which is the whole point: the limit holds no matter which instance serves a request.
upstream ratelimiter {
    server api1:8000;
    server api2:8000;
    server api3:8000;
    keepalive 64;
}
server {
    listen 80;
    location / {
        proxy_pass http://ratelimiter;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # The app trusts X-Real-IP ONLY because RL_TRUST_FORWARDED_FOR=true is set for
        # instances that are reachable exclusively through this proxy.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }
}
