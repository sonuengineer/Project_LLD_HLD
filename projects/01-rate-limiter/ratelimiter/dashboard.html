<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rate Limiter Dashboard</title>
<style>
body{font-family:system-ui,sans-serif;margin:24px;background:#0f1115;color:#e6e6e6}
table{border-collapse:collapse;width:100%;max-width:900px}td,th{padding:8px 12px;border-bottom:1px solid #2a2f3a;text-align:left}
th{color:#9aa4b2;font-weight:600}.denied{color:#ff7b72}.allowed{color:#7ee787}.deg{color:#e3b341}
input{background:#1b1f27;color:#e6e6e6;border:1px solid #2a2f3a;padding:6px;border-radius:4px;width:260px}
small{color:#9aa4b2}
</style></head><body>
<h1>Rate Limiter -- live decisions (this instance)</h1>
<p><small>Per-instance counters. Behind a load balancer, sum across instances in Prometheus.</small></p>
<p>Admin token: <input id="tok" type="password" placeholder="X-Admin-Token"></p>
<table><thead><tr><th>Policy</th><th>Allowed</th><th>Denied</th><th>Degraded allow</th><th>Degraded deny</th><th>Deny %</th></tr></thead>
<tbody id="rows"><tr><td colspan="6">enter admin token...</td></tr></tbody></table>
<p id="err" class="denied"></p>
<script>
const tok=document.getElementById('tok');
try{tok.value=localStorage.getItem('rl_admin')||''}catch(e){}
tok.onchange=()=>{try{localStorage.setItem('rl_admin',tok.value)}catch(e){}};
async function tick(){
  if(!tok.value)return;
  const r=await fetch('/admin/stats',{headers:{'X-Admin-Token':tok.value}});
  if(!r.ok){document.getElementById('err').textContent='HTTP '+r.status;return}
  document.getElementById('err').textContent='';
  const d=await r.json();
  const rows=Object.entries(d.policies).map(([p,v])=>{
    const a=v.allowed||0,de=v.denied||0,t=a+de;
    return `<tr><td>${p}</td><td class=allowed>${a}</td><td class=denied>${de}</td><td class=deg>${v.degraded_allow||0}</td><td class=deg>${v.degraded_deny||0}</td><td>${t?(100*de/t).toFixed(1):0}%</td></tr>`}).join('');
  document.getElementById('rows').innerHTML=rows||'<tr><td colspan=6>no traffic yet</td></tr>';
}
setInterval(tick,2000);tick();
</script></body></html>
