<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workflow Executions</title>
<style>
:root{--bg:#0f1115;--fg:#e6e6e6;--mut:#9aa4b2;--line:#2a2f3a;--ok:#7ee787;--bad:#ff7b72;--warn:#e3b341;--card:#161a22}
body{font-family:system-ui,sans-serif;margin:0;padding:20px;background:var(--bg);color:var(--fg)}
h1{font-size:20px;margin:0 0 12px}h2{font-size:15px;color:var(--mut);margin:20px 0 8px}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut)}.completed{color:var(--ok)}.failed{color:var(--bad)}.running{color:var(--warn)}.cancelled{color:var(--mut)}
tr.sel{background:var(--card)}tr[data-id]{cursor:pointer}.wrap{overflow-x:auto}pre{background:var(--card);padding:10px;font-size:12px;white-space:pre-wrap;max-height:420px;overflow:auto}
#cards{display:flex;gap:12px;flex-wrap:wrap}.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 14px;min-width:110px}.card b{display:block;font-size:20px}
</style></head><body>
<h1>Workflow executions</h1>
<div id="cards"></div>
<h2>Workflows (click one for its event history)</h2>
<div class="wrap"><table><thead><tr><th>Workflow id</th><th>Type</th><th>Status</th><th>Events</th><th>Error</th><th>Started</th></tr></thead><tbody id="wf"></tbody></table></div>
<h2>History <span id="hid" class="mut"></span></h2><pre id="hist">select a workflow</pre>
<h2>Workers</h2><div class="wrap"><table><thead><tr><th>Worker</th><th>Queues</th><th>Heartbeat age</th></tr></thead><tbody id="wk"></tbody></table></div>
<script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));let sel=null;
async function j(p){return (await fetch(p)).json()}
async function showHist(id){sel=id;$('hid').textContent=id;const h=await j('/workflows/'+encodeURIComponent(id)+'/history');
 $('hist').textContent=h.events.map(e=>`#${e.event_id} ${e.created_at.slice(11,23)} ${e.event_type} ${JSON.stringify(e.attrs)}`).join('\n')}
async function tick(){
 const st=await j('/stats');$('cards').innerHTML=['running','completed','failed','cancelled'].map(k=>`<div class=card><span class=${k}>${k}</span><b>${st.workflows[k]||0}</b></div>`).join('')+`<div class=card>task backlog<b>${st.workflow_task_backlog}</b></div>`;
 const w=await j('/workflows?limit=100');
 $('wf').innerHTML=w.workflows.map(x=>`<tr data-id="${esc(x.workflow_id)}" class="${x.workflow_id===sel?'sel':''}"><td>${esc(x.workflow_id)}</td><td>${esc(x.workflow_type)}</td><td class=${x.status}>${x.status}</td><td>${x.last_event_id}</td><td>${esc((x.error||'').slice(0,80))}</td><td>${esc(x.created_at).slice(0,19)}</td></tr>`).join('');
 document.querySelectorAll('tr[data-id]').forEach(r=>r.onclick=()=>showHist(r.dataset.id));
 const k=await j('/workers');$('wk').innerHTML=k.workers.map(x=>`<tr><td>${esc(x.worker_id)}</td><td>${esc(x.task_queues.join(', '))}</td><td>${Number(x.seconds_since_heartbeat).toFixed(1)}s</td></tr>`).join('')||'<tr><td colspan=3>no workers</td></tr>';
 if(sel)showHist(sel)}
setInterval(tick,2000);tick();
</script></body></html>
