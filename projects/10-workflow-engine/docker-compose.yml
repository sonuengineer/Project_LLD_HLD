#   docker compose up -d --build      -> http://127.0.0.1:58010/dashboard
#   python demo.py http://127.0.0.1:58010
name: p10-workflow-engine
x-env: &env
  FLOW_DATABASE_URL: postgresql+asyncpg://flow:${FLOW_DB_PASSWORD:-flow_dev_password}@postgres:5432/flow
x-img: &img
  build: {context: ../.., dockerfile: projects/10-workflow-engine/Dockerfile}
services:
  postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_USER: flow, POSTGRES_PASSWORD: "${FLOW_DB_PASSWORD:-flow_dev_password}", POSTGRES_DB: flow}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U flow"], interval: 3s, retries: 20}
  migrate:
    <<: *img
    environment: *env
    command: ["alembic", "upgrade", "head"]
    depends_on: {postgres: {condition: service_healthy}}
  api:
    <<: *img
    environment: *env
    ports: ["127.0.0.1:58010:8000"]
    depends_on: {migrate: {condition: service_completed_successfully}}
  worker:
    <<: *img
    environment: *env
    command: ["python", "-m", "flowengine", "--activity-concurrency", "16"]
    deploy: {replicas: 2}
    stop_grace_period: 15s
    depends_on: {migrate: {condition: service_completed_successfully}}
volumes:
  pgdata:
