<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>minikafka Cluster</title>
<style>
:root{--bg:#0f1115;--fg:#e6e6e6;--mut:#9aa4b2;--line:#2a2f3a;--ok:#7ee787;--bad:#ff7b72;--warn:#e3b341;--card:#161a22}
body{font-family:system-ui,sans-serif;margin:0;padding:20px;background:var(--bg);color:var(--fg)}
h1{font-size:20px;margin:0 0 12px}h2{font-size:15px;color:var(--mut);margin:20px 0 8px}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mut)}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
button,input{background:var(--card);color:var(--fg);border:1px solid var(--line);padding:5px 8px;border-radius:4px;cursor:pointer}
.wrap{overflow-x:auto}pre{background:var(--card);padding:10px;font-size:12px;max-height:240px;overflow:auto;white-space:pre-wrap}
</style></head><body>
<h1>minikafka cluster</h1>
<p>Admin token (fault injection): <input id="tok" type="password" size="24"></p>
<h2>Brokers</h2><div class="wrap"><table><thead><tr><th>Broker</th><th>Process</th><th>Network</th><th>Heartbeat age</th><th>Fault injection</th></tr></thead><tbody id="brokers"></tbody></table></div>
<h2>Partitions</h2><div class="wrap"><table><thead><tr><th>Topic-partition</th><th>Leader</th><th>Epoch</th><th>Replicas</th><th>ISR</th><th>HW</th><th>LEO</th><th>Replica LEOs</th></tr></thead><tbody id="parts"></tbody></table></div>
<h2>Consumer groups</h2><div class="wrap"><table><thead><tr><th>Group</th><th>State</th><th>Generation</th><th>Members</th><th>Total lag</th></tr></thead><tbody id="groups"></tbody></table></div>
<h2>Controller events</h2><pre id="events"></pre>
<script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function act(id,a){await fetch(`/admin/brokers/${id}/${a}`,{method:'POST',headers:{'X-Admin-Token':$('tok').value}});tick()}
async function tick(){try{
 const m=await (await fetch('/metadata')).json();
 $('brokers').innerHTML=m.brokers.map(b=>`<tr><td>${b.id}</td><td class="${b.alive?'ok':'bad'}">${b.alive?'up':'DOWN'}</td><td class="${b.reachable?'ok':'warn'}">${b.reachable?'ok':'ISOLATED'}</td><td>${b.seconds_since_heartbeat}s</td><td>${['kill','restart','isolate','heal'].map(a=>`<button onclick="act(${b.id},'${a}')">${a}</button>`).join(' ')}</td></tr>`).join('');
 const rows=[];for(const [t,d] of Object.entries(m.topics))for(const p of d.partitions)rows.push(`<tr><td>${esc(t)}-${p.partition}</td><td class="${p.leader===null?'bad':''}">${p.leader===null?'OFFLINE':p.leader}</td><td>${p.leader_epoch}</td><td>${p.replicas.join(',')}</td><td class="${p.isr.length<p.replicas.length?'warn':'ok'}">${p.isr.join(',')}</td><td>${p.high_watermark??''}</td><td>${p.log_end_offset??''}</td><td>${esc(JSON.stringify(p.replica_leo))}</td></tr>`);
 $('parts').innerHTML=rows.join('')||'<tr><td colspan=8>no topics</td></tr>';
 const g=await (await fetch('/groups')).json();
 $('groups').innerHTML=g.groups.map(x=>`<tr><td>${esc(x.group)}</td><td>${x.state}</td><td>${x.generation}</td><td>${x.members.length}</td><td>${x.lag.reduce((s,l)=>s+(l.lag||0),0)}</td></tr>`).join('')||'<tr><td colspan=5>none</td></tr>';
 const e=await (await fetch('/events')).json();$('events').textContent=e.events.slice().reverse().join('\n');
}catch(err){}}
setInterval(tick,1500);tick();
</script></body></html>
