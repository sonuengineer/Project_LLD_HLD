#   docker compose up -d --build      -> http://127.0.0.1:58005/dashboard
#   python demo.py http://127.0.0.1:58005
name: p05-mini-kafka
services:
  minikafka:
    build: {context: ../.., dockerfile: projects/05-mini-kafka/Dockerfile}
    environment:
      MK_ADMIN_TOKEN: ${MK_ADMIN_TOKEN:-change-me-mk-token}
    volumes: ["mk-data:/data"]
    ports: ["127.0.0.1:58005:8000"]
volumes:
  mk-data:
