#   docker compose up -d --build        (api on 127.0.0.1:58003, 3 workers)
#   docker compose up -d --scale worker=6
name: p03-job-queue
x-env: &env
  JQ_REDIS_URL: redis://redis:6379/0
  JQ_DATABASE_URL: postgresql+asyncpg://jq:${JQ_DB_PASSWORD:-jq_dev_password}@postgres:5432/jobqueue
  JQ_API_TOKEN: ${JQ_API_TOKEN:-change-me-jq-token}
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 3s, retries: 20}
  postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_USER: jq, POSTGRES_PASSWORD: "${JQ_DB_PASSWORD:-jq_dev_password}", POSTGRES_DB: jobqueue}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U jq"], interval: 3s, retries: 20}
  migrate:
    build: {context: ../.., dockerfile: projects/03-job-queue/Dockerfile}
    environment: *env
    command: ["alembic", "upgrade", "head"]
    depends_on: {postgres: {condition: service_healthy}}
  api:
    build: {context: ../.., dockerfile: projects/03-job-queue/Dockerfile}
    environment: *env
    ports: ["127.0.0.1:58003:8000"]
    depends_on: {redis: {condition: service_healthy}, migrate: {condition: service_completed_successfully}}
  worker:
    build: {context: ../.., dockerfile: projects/03-job-queue/Dockerfile}
    environment: *env
    command: ["python", "-m", "jobqueue.worker", "--queues", "critical,default,low", "--concurrency", "16"]
    deploy: {replicas: 3}
    stop_grace_period: 30s      # SIGTERM -> drain in-flight jobs before SIGKILL
    depends_on: {redis: {condition: service_healthy}, migrate: {condition: service_completed_successfully}}
