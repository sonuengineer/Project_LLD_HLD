<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Job Queue Dashboard</title>
<style>
:root{--bg:#0f1115;--fg:#e6e6e6;--mut:#9aa4b2;--line:#2a2f3a;--ok:#7ee787;--bad:#ff7b72;--warn:#e3b341;--card:#161a22}
body{font-family:system-ui,sans-serif;margin:0;padding:20px;background:var(--bg);color:var(--fg)}
h1{font-size:20px;margin:0 0 12px}h2{font-size:15px;color:var(--mut);margin:20px 0 8px}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
input,select,button{background:var(--card);color:var(--fg);border:1px solid var(--line);padding:6px 8px;border-radius:4px}
button{cursor:pointer}code{font-size:12px;color:var(--mut)}.wrap{overflow-x:auto}
</style></head><body>
<h1>Job Queue</h1>
<p>API token: <input id="tok" type="password" placeholder="JQ_API_TOKEN" size="28"> <span id="err" class="bad"></span></p>
<h2>Queues</h2><div class="wrap"><table><thead><tr><th>Queue</th><th>Ready</th><th>Delayed</th><th>Active</th><th>Dead</th><th>Enqueued</th><th>Succeeded</th><th>Retried</th><th>Reaped</th></tr></thead><tbody id="queues"></tbody></table></div>
<h2>Workers</h2><div class="wrap"><table><thead><tr><th>Worker</th><th>Health</th><th>Queues</th><th>Running</th><th>Processed</th><th>Succeeded</th><th>Failed</th><th>Stale acks</th></tr></thead><tbody id="workers"></tbody></table></div>
<h2>Dead letter queue <select id="dlqq"></select></h2><div class="wrap"><table><thead><tr><th>Job</th><th>Type</th><th>Attempts</th><th>Last error</th><th></th></tr></thead><tbody id="dlq"></tbody></table></div>
<script>
const $=id=>document.getElementById(id);
try{$('tok').value=localStorage.getItem('jq_tok')||''}catch(e){}
$('tok').onchange=()=>{try{localStorage.setItem('jq_tok',$('tok').value)}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{Authorization:'Bearer '+$('tok').value}});if(!r.ok)throw new Error(path+' -> HTTP '+r.status);return r.json()}
async function requeue(id){await api('/dlq/'+id+'/requeue',{method:'POST'});tick()}
async function tick(){
  if(!$('tok').value)return;
  try{
    const q=await api('/queues');$('err').textContent='';
    $('queues').innerHTML=q.queues.map(x=>`<tr><td>${esc(x.queue)}</td><td>${x.ready}</td><td>${x.delayed}</td><td>${x.active}</td><td class="${x.dead?'bad':''}">${x.dead}</td><td>${x.counters.enqueued||0}</td><td class=ok>${x.counters.succeeded||0}</td><td class=warn>${x.counters.retried||0}</td><td class=warn>${x.counters.reaped||0}</td></tr>`).join('')||'<tr><td colspan=9>no queues yet</td></tr>';
    const sel=$('dlqq'),cur=sel.value;sel.innerHTML=q.queues.map(x=>`<option ${x.queue===cur?'selected':''}>${esc(x.queue)}</option>`).join('');
    const w=await api('/workers');
    $('workers').innerHTML=w.workers.map(x=>`<tr><td><code>${esc(x.id)}</code></td><td class="${x.alive?'ok':'bad'}">${x.alive?'alive':'STALE '+x.seconds_since_heartbeat+'s'}</td><td>${esc(x.queues.join(', '))}</td><td>${x.running.length}</td><td>${x.processed}</td><td>${x.succeeded}</td><td>${x.failed}</td><td>${x.stale_acks}</td></tr>`).join('')||'<tr><td colspan=8>no workers</td></tr>';
    if(sel.value){const d=await api('/dlq?queue='+encodeURIComponent(sel.value));
      $('dlq').innerHTML=d.jobs.map(j=>`<tr><td><code>${esc(j.id)}</code></td><td>${esc(j.type)}</td><td>${j.attempts}/${j.max_attempts}</td><td><code>${esc((j.last_error||'').slice(0,160))}</code></td><td><button onclick="requeue('${esc(j.id)}')">Requeue</button></td></tr>`).join('')||'<tr><td colspan=5>empty</td></tr>';}
  }catch(e){$('err').textContent=e.message}
}
setInterval(tick,2000);tick();
</script></body></html>
